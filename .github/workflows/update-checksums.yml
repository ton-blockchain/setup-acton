name: Update Checksums

on:
  schedule:
    # 08:00 Europe/Moscow every Monday (05:00 UTC)
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: update-checksums
  cancel-in-progress: false

permissions: { }

jobs:
  update:
    name: Update known checksums
    if: github.repository == 'ton-blockchain/setup-acton'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write # push the generated update branch
      pull-requests: write # create or update the pull request

    steps:
      - name: Fetch Sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Update known checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run checksums:update

      - name: Check for changes
        id: changes
        # language=Bash
        run: |
          if git diff --quiet -- src/download/known-checksums.ts; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build distribution files
        if: steps.changes.outputs.changed == 'true'
        run: bun run package

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/update-checksums
        # language=Bash
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create "${UPDATE_BRANCH}"
          git add src/download/known-checksums.ts dist/setup/index.cjs
          git commit --message "chore(checksums): update known checksums"

          remote_sha=$(git ls-remote --heads origin "${UPDATE_BRANCH}" | awk '{print $1}')
          if [[ -n "${remote_sha}" ]]; then
            git push origin "HEAD:refs/heads/${UPDATE_BRANCH}" \
              --force-with-lease="refs/heads/${UPDATE_BRANCH}:${remote_sha}"
          else
            git push --set-upstream origin "${UPDATE_BRANCH}"
          fi

          body_file="${RUNNER_TEMP}/checksums-pr.md"
          cat > "${body_file}" <<EOF
          Updates the known SHA-256 checksums from published stable Acton releases and rebuilds the action bundle.

          Validation is handled by the repository's standard pull request CI.
          EOF

          pull_request=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${UPDATE_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [[ -z "${pull_request}" ]]; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base master \
              --head "${UPDATE_BRANCH}" \
              --title "chore(checksums): update known checksums" \
              --body-file "${body_file}"
          else
            gh pr edit "${pull_request}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "chore(checksums): update known checksums" \
              --body-file "${body_file}"
          fi
